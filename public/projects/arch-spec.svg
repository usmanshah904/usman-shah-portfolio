<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d">
  <title id="t">Spec-driven smart task manager</title>
  <desc id="d">The specifications define user stories, requirements and acceptance criteria. The React app implements them: dashboard and task list components on top of the useTasks hook, pure helpers for filtering and statistics, and validated browser storage. 43 automated tests check every acceptance criterion; when requirements change, the specification is updated first.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#1C2321"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#5C6660"/>
    </marker>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1C2321"/><stop offset="0.55" stop-color="#3F6B55"/><stop offset="1" stop-color="#5E8C76"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1C2321" fill-opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1C2321; }
    .h { font-size: 22px; font-weight: 700; }
    .sub { font-size: 14px; fill: #48524D; }
    .title { font-size: 16px; font-weight: 700; }
    .small-title { font-size: 14px; font-weight: 700; }
    .line { font-size: 13px; fill: #48524D; }
    .code { font-family: Consolas, "SF Mono", Menlo, monospace; font-size: 12.5px; fill: #1C2321; }
    .label { font-size: 12px; font-weight: 600; fill: #5C6660; letter-spacing: 0.05em; }
    .small { font-size: 12px; fill: #48524D; }
    .tick { font-size: 13px; font-weight: 700; fill: #067647; }
    @media (prefers-reduced-motion: reduce) { .live { display: none; } }
  </style>

  <rect width="1200" height="600" rx="20" fill="#F7F8F4"/>
  <rect width="1200" height="600" rx="20" fill="url(#dots)"/>
  <rect x="0" y="0" width="1200" height="5" fill="url(#brand)"/>
  <text x="40" y="52" class="h">Specify → implement → validate</text>
  <text x="40" y="78" class="sub">Every feature starts as an acceptance criterion in the spec and is only done when its test passes</text>

  <!-- glows -->

