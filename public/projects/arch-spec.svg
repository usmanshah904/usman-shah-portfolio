  <!-- Specs -->
  <rect x="40" y="130" width="250" height="340" rx="16" fill="#ffffff" stroke="#1C2321" stroke-width="2"/>
  <text x="58" y="122" class="label">1 · SPECS  (specs/)</text>
  <rect x="56" y="152" width="218" height="78" rx="10" fill="#EEF0EA" stroke="#D3DACE"/><text x="72" y="184" class="code">constitution.md</text><text x="72" y="206" class="small">principles &amp; workflow</text>
  <rect x="56" y="252" width="218" height="78" rx="10" fill="#EEF0EA" stroke="#D3DACE"/><text x="72" y="284" class="code">feature-spec.md</text><text x="72" y="306" class="small">US-1–11 · FR-1–12 · AC-1–16</text>
  <rect x="56" y="352" width="218" height="78" rx="10" fill="#EEF0EA" stroke="#D3DACE"/><text x="72" y="384" class="code">roadmap.md</text><text x="72" y="406" class="small">phases 1–8 (8: dashboard)</text>

  <!-- App -->
  <rect x="330" y="130" width="540" height="340" rx="16" fill="#ffffff" stroke="#3F6B55" stroke-width="2"/>
  <text x="348" y="122" class="label">2 · APP  (React + TypeScript, task-manager/)</text>
  <rect x="350" y="180" width="240" height="92" rx="12" fill="#ffffff" stroke="#3F6B55" stroke-width="1.4"/><text x="366" y="208" class="small-title">Dashboard</text><text x="366" y="230" class="line">stat cards · progress ring</text><text x="366" y="249" class="line">7-day bars · category donut</text>
  <rect x="610" y="180" width="240" height="92" rx="12" fill="#ffffff" stroke="#3F6B55" stroke-width="1.4"/><text x="626" y="208" class="small-title">Task list</text><text x="626" y="230" class="line">add with priority, category, due</text><text x="626" y="249" class="line">search · status · category</text>
  <rect x="350" y="296" width="240" height="70" rx="12" fill="#ffffff" stroke="#5E8C76" stroke-width="1.4"/><text x="366" y="324" class="small-title">useTasks()</text><text x="366" y="346" class="line">add · toggle · delete · sample</text>
  <rect x="610" y="296" width="240" height="70" rx="12" fill="#ffffff" stroke="#5E8C76" stroke-width="1.4"/><text x="626" y="324" class="small-title">Pure helpers</text><text x="626" y="346" class="line">computeStats · filterTasks · dueStatus</text>
  <rect x="350" y="390" width="500" height="56" rx="12" fill="#EEF0EA" stroke="#C9D1C4"/>
  <text x="366" y="414" class="code">storage.ts</text>
  <text x="366" y="434" class="small">localStorage · validates saved data · old tasks get defaults</text>
  <path d="M470 296 V274" stroke="#5E8C76" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M590 331 H608" stroke="#5E8C76" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M730 296 V274" stroke="#5E8C76" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M470 366 V388" stroke="#5E8C76" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Tests -->
  <rect x="910" y="130" width="250" height="340" rx="16" fill="#ffffff" stroke="#067647" stroke-width="2"/>
  <text x="928" y="122" class="label">3 · TESTS  (Vitest, 43)</text>
  <text x="928" y="166" class="small">one test group per criterion</text>
  <rect x="926" y="196" width="218" height="66" rx="10" fill="#EEF0EA" stroke="#D3DACE"/><text x="942" y="224" class="small-title">AC-1 – AC-8</text><text x="942" y="244" class="small">MVP: create … persist</text>
  <rect x="926" y="276" width="218" height="66" rx="10" fill="#EEF0EA" stroke="#D3DACE"/><text x="942" y="304" class="small-title">AC-9 – AC-16</text><text x="942" y="324" class="small">dashboard, sample data</text>
  <rect x="926" y="356" width="218" height="66" rx="10" fill="#EEF0EA" stroke="#D3DACE"/><text x="942" y="384" class="small-title">Helpers &amp; storage</text><text x="942" y="404" class="small">stats, dates, filters, old data</text>

  <!-- flow -->
  <path d="M290 300 H328" fill="none" stroke="#1C2321" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="309" y="290" text-anchor="middle" class="small">build</text>
  <path d="M870 300 H908" fill="none" stroke="#1C2321" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="889" y="290" text-anchor="middle" class="small">check</text>
  <path d="M1035 470 V520 H165 V472" fill="none" stroke="#5C6660" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrowMuted)"/>
  <text x="600" y="540" text-anchor="middle" class="small">requirements change → update the spec first (Phase 6 replanning), then build and re-validate</text>
  <text x="40" y="580" class="line">The dashboard was added this way: US-7–11, FR-7–12 and AC-9–16 were written into the spec before any code.</text>

