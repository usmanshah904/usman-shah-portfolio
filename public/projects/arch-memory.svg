  <!-- Task -->
  <rect x="40" y="214" width="128" height="96" rx="14" fill="#ffffff" stroke="#C9D1C4"/>
  <text x="104" y="254" text-anchor="middle" class="title">Task</text>
  <text x="104" y="278" text-anchor="middle" class="small">your request</text>

  <!-- 1 Retrieve -->
  <rect x="206" y="196" width="200" height="132" rx="14" fill="#ffffff" stroke="#5E8C76" stroke-width="2"/>
  <rect x="206" y="196" width="200" height="6" rx="3" fill="#5E8C76"/>
  <circle cx="206" cy="196" r="13" fill="#5E8C76"/><text x="206" y="200.5" text-anchor="middle" class="step">1</text>
  <text x="226" y="232" class="title">Retrieve</text>
  <text x="226" y="256" class="code">search_memories()</text>
  <text x="226" y="278" class="line">keyword match, top 3,</text>
  <text x="226" y="296" class="line">only relevant memories</text>

  <!-- 2 Respond -->
  <rect x="440" y="196" width="200" height="132" rx="14" fill="#ffffff" stroke="#3F6B55" stroke-width="2"/>
  <rect x="440" y="196" width="200" height="6" rx="3" fill="#3F6B55"/>
  <circle cx="440" cy="196" r="13" fill="#3F6B55"/><text x="440" y="200.5" text-anchor="middle" class="step">2</text>
  <text x="460" y="232" class="title">Respond</text>
  <text x="460" y="256" class="line">Claude answers, following</text>
  <text x="460" y="276" class="line">the retrieved preferences</text>
  <text x="460" y="296" class="line">and skills</text>

  <!-- 3 Learn -->
  <rect x="674" y="196" width="200" height="132" rx="14" fill="#ffffff" stroke="#3F6B55" stroke-width="2"/>
  <rect x="674" y="196" width="200" height="6" rx="3" fill="#3F6B55"/>
  <circle cx="674" cy="196" r="13" fill="#3F6B55"/><text x="674" y="200.5" text-anchor="middle" class="step">3</text>
  <text x="694" y="232" class="title">Learn</text>
  <text x="694" y="256" class="line">Claude extracts one reusable</text>
  <text x="694" y="276" class="line">preference, skill or</text>
  <text x="694" y="296" class="line">instruction (JSON)</text>

  <!-- 4 Save -->
  <rect x="908" y="196" width="252" height="132" rx="14" fill="#ffffff" stroke="#1C2321" stroke-width="2"/>
  <rect x="908" y="196" width="252" height="6" rx="3" fill="#1C2321"/>
  <circle cx="908" cy="196" r="13" fill="#1C2321"/><text x="908" y="200.5" text-anchor="middle" class="step">4</text>
  <text x="928" y="232" class="title">Consolidate &amp; save</text>
  <text x="928" y="256" class="line">merges similar memories of</text>
  <text x="928" y="276" class="line">the same kind, keeps the</text>
  <text x="928" y="296" class="line">most detailed wording</text>

  <!-- Store -->
  <rect x="336" y="412" width="528" height="120" rx="16" fill="#ffffff" stroke="#C9D1C4" stroke-width="1.5"/>
  <text x="356" y="438" class="label">MEMORY STORE · memory/memories.json</text>
  <text x="356" y="520" class="small">each memory: id · category · created · last used · use count</text>

  <!-- Flow -->
